name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22"
  NODE_VERSION: "22"

jobs:
  # 面板的前端是 Vite + Vue 3，产物 web/assets/dist/ 被 //go:embed 进二进制并且
  # 提交进了仓库 —— 这样没装 Node 的人 `go build` 出来的面板也是能用的。
  # 代价是产物可能变陈旧：改了 .vue 忘了重新构建，CI 全绿，用户拿到的是旧界面。
  # 这个 job 就是那道闸：重新构建一次，产物必须和仓库里的逐字节一致。
  #
  # 之所以敢做逐字节比对：依赖全部由 package-lock.json 锁定（npm ci），
  # 同一份源码连续构建的输出是稳定的。若哪天 Node 大版本升级导致 minifier
  # 输出漂移，改 NODE_VERSION 的那个 PR 顺手重新构建提交即可。
  frontend:
    name: frontend build / typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      # 用 ci 而不是 install：锁文件与 package.json 不一致时直接失败，
      # 而不是悄悄改写锁文件后继续。
      - name: Install dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Typecheck
        working-directory: web/frontend
        run: npm run typecheck

      - name: Build
        working-directory: web/frontend
        run: npm run build:fast

      - name: Committed bundle is up to date
        run: |
          set -euo pipefail
          if ! git diff --quiet -- web/assets/dist; then
            echo "::error::web/assets/dist is stale — the committed bundle does not match a fresh build."
            echo "Run 'npm --prefix web/frontend ci && npm --prefix web/frontend run build' and commit the result."
            git --no-pager diff --stat -- web/assets/dist
            exit 1
          fi

  build-and-test:
    name: build / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # web/e2e_render_test.go 用 jsdom 真跑一遍打包产物，确认 Vue 挂得上、
      # 页面渲染得出内容 —— 迁到 SPA 之后，这是唯一能发现"200 白页"的用例。
      # 没有 node 时它会自己跳过，所以本地不装 Node 也能 go test；
      # CI 里必须装上，否则那条护栏在最需要它的地方是静默失效的。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install frontend dev dependencies
        working-directory: web/frontend
        run: npm ci

      # go.sum 曾经缺失 ~363 条目而没人发现，因为没有 CI。
      # -mod=readonly 会在 go.mod/go.sum 与源码不一致时直接失败。
      - name: Verify go.mod / go.sum are tidy
        run: |
          set -euo pipefail
          cp go.mod go.mod.bak
          cp go.sum go.sum.bak
          go mod tidy
          diff -u go.mod.bak go.mod
          diff -u go.sum.bak go.sum
          rm go.mod.bak go.sum.bak

      - name: gofmt
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      # 纯 Go SQLite 驱动意味着 CGO_ENABLED=0 也能构建；这里额外验证一次，
      # 保证 release.yml 的交叉编译（同样 CGO_ENABLED=0）不会在 tag 时才炸。
      - name: Build without cgo
        env:
          CGO_ENABLED: 0
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # 面板的部署形态是 CGO_ENABLED=0 的静态二进制，所以先按那个配置跑一遍
      # 测试：驱动、embed、模板解析都要在真正发布的构建条件下验证过。
      - name: Test
        env:
          CGO_ENABLED: 0
          # 前端渲染用例在缺 node/jsdom 时会自己跳过。CI 里两者都装好了，
          # 所以这里要求它必须真的跑起来，而不是悄悄跳过。
          XUI_REQUIRE_RENDER_TEST: "1"
        run: go test -count=1 -timeout 15m ./...

      # -race 需要 cgo，ubuntu-latest 自带 gcc。
      # 端到端用例里有并发登录与并发混合语言渲染，就是冲着这一步来的。
      - name: Test (race)
        env:
          CGO_ENABLED: 1
          XUI_REQUIRE_RENDER_TEST: "1"
        run: go test -race -count=1 -timeout 20m ./...
