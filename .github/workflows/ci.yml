name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22"

jobs:
  build-and-test:
    name: build / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # go.sum 曾经缺失 ~363 条目而没人发现，因为没有 CI。
      # -mod=readonly 会在 go.mod/go.sum 与源码不一致时直接失败。
      - name: Verify go.mod / go.sum are tidy
        run: |
          set -euo pipefail
          cp go.mod go.mod.bak
          cp go.sum go.sum.bak
          go mod tidy
          diff -u go.mod.bak go.mod
          diff -u go.sum.bak go.sum
          rm go.mod.bak go.sum.bak

      - name: gofmt
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      # 纯 Go SQLite 驱动意味着 CGO_ENABLED=0 也能构建；这里额外验证一次，
      # 保证 release.yml 的交叉编译（同样 CGO_ENABLED=0）不会在 tag 时才炸。
      - name: Build without cgo
        env:
          CGO_ENABLED: 0
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race 需要 cgo，ubuntu-latest 自带 gcc。
      - name: Test (race)
        env:
          CGO_ENABLED: 1
        run: go test -race -count=1 ./...
