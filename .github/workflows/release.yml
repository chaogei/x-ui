name: Release X-ui
on:
  push:
    tags:
      - 'v*'
      - '1.*'
  workflow_dispatch:

env:
  SINGBOX_VERSION: "1.11.0"
  GO_VERSION: "1.22"
  NODE_VERSION: "22"
  # 构建标志：
  #  -trimpath      去除本地路径信息，便于复现构建
  #  -s -w          去除符号表与 DWARF 调试信息，减小二进制体积
  #  -buildid=      清空 buildid，保证可复现
  BUILD_FLAGS: "-trimpath"
  LD_FLAGS: "-s -w -buildid="

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
          - arch: s390x
            goarch: s390x
    name: build x-ui ${{ matrix.arch }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      # 面板界面全部由 web/assets/dist/ 里的 Vite 产物渲染，而这份产物是
      # //go:embed 进二进制的。仓库里虽然提交了一份，发布构建仍然重新生成：
      # 发出去的包必须对应这个 tag 的前端源码，而不是某次提交时的快照。
      - name: Build frontend
        run: |
          set -euo pipefail
          npm --prefix web/frontend ci
          npm --prefix web/frontend run build:fast
          test -s web/assets/dist/xui.js
          test -s web/assets/dist/xui.css

      # SQLite 驱动改为纯 Go 的 glebarez/sqlite 后不再需要 cgo，
      # 交叉编译也不用装 gcc-aarch64 / gcc-s390x 工具链。
      - name: Build x-ui
        run: |
          set -euo pipefail
          export CGO_ENABLED=0
          export GOOS=linux
          export GOARCH=${{ matrix.goarch }}
          go build ${BUILD_FLAGS} -ldflags="${LD_FLAGS}" -o xui-release -v main.go

      - name: Package release tarball
        run: |
          set -euo pipefail
          mkdir x-ui
          mv xui-release x-ui/x-ui
          cp x-ui.service x-ui/x-ui.service
          cp x-ui.sh x-ui/x-ui.sh
          mkdir x-ui/bin
          SB_FILE="sing-box-${SINGBOX_VERSION}-linux-${{ matrix.arch }}"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/${SB_FILE}.tar.gz"
          tar -xzf "${SB_FILE}.tar.gz"
          mv "${SB_FILE}/sing-box" "x-ui/bin/sing-box-linux-${{ matrix.arch }}"
          chmod +x "x-ui/bin/sing-box-linux-${{ matrix.arch }}" x-ui/x-ui x-ui/x-ui.sh
          rm -rf "${SB_FILE}" "${SB_FILE}.tar.gz"
          tar -zcvf "x-ui-linux-${{ matrix.arch }}.tar.gz" x-ui

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-ui-linux-${{ matrix.arch }}
          path: x-ui-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: true
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
