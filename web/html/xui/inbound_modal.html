{{define "inboundModal"}}
<a-modal id="inbound-modal" v-model="inModal.visible" :title="inModal.title" @ok="inModal.ok"
         :confirm-loading="inModal.confirmLoading" :closable="true" :mask-closable="false"
         :ok-text="inModal.okText" cancel-text='{{ i18n "close" }}'>
    {{template "form/inbound"}}
</a-modal>
<script>

    const inModal = {
        title: '',
        visible: false,
        confirmLoading: false,
        okText: '{{ i18n "confirm" }}',
        confirm: null,
        inbound: new Inbound(),
        dbInbound: new DBInbound(),
        ok() {
            ObjectUtil.execute(inModal.confirm, inModal.inbound, inModal.dbInbound);
        },
        show({ title='', okText='{{ i18n "confirm" }}', inbound=null, dbInbound=null, confirm=(inbound, dbInbound)=>{} }) {
            this.title = title;
            this.okText = okText;
            if (inbound) {
                this.inbound = Inbound.fromJson(inbound.toJson());
            } else {
                this.inbound = new Inbound();
            }
            if (dbInbound) {
                this.dbInbound = new DBInbound(dbInbound);
            } else {
                this.dbInbound = new DBInbound();
            }
            this.confirm = confirm;
            this.visible = true;
        },
        close() {
            inModal.visible = false;
            inModal.loading(false);
        },
        loading(loading) {
            inModal.confirmLoading = loading;
        },
    };

    // 面板可创建的入站协议。顺序决定下拉框展示顺序，常用协议置顶.
    const protocols = {
        VMESS: Protocols.VMESS,
        VLESS: Protocols.VLESS,
        TROJAN: Protocols.TROJAN,
        SHADOWSOCKS: Protocols.SHADOWSOCKS,
        HYSTERIA2: Protocols.HYSTERIA2,
        TUIC: Protocols.TUIC,
        ANYTLS: Protocols.ANYTLS,
        SHADOWTLS: Protocols.SHADOWTLS,
        NAIVE: Protocols.NAIVE,
        WIREGUARD: Protocols.WIREGUARD,
        SOCKS: Protocols.SOCKS,
        HTTP: Protocols.HTTP,
        MIXED: Protocols.MIXED,
        DIRECT: Protocols.DIRECT,
    };

    new Vue({
        delimiters: ['[[', ']]'],
        el: '#inbound-modal',
        data: {
            inModal: inModal,
            Protocols: protocols,
            SSMethods: SSMethods,
            get inbound() {
                return inModal.inbound;
            },
            get dbInbound() {
                return inModal.dbInbound;
            }
        },
        methods: {
            // 由后端一次性生成配套的 Reality X25519 密钥对。
            // 两个字段同源写入，用户不可能再填出 public_key 与 private_key 不匹配的组合
            // （错配只会在客户端连不上时才暴露，极难排查）。
            async genRealityKeyPair(inbound) {
                const msg = await HttpUtil.post('/xui/api/reality/keypair');
                if (!msg.success || !msg.obj) {
                    return;
                }
                const reality = inbound.settings.tls.reality;
                reality.private_key = msg.obj.private_key;
                reality.public_key = msg.obj.public_key;
            },
        },
    });

</script>
{{end}}
